site_name: Chebarkul Grant Project
site_description: "Документация и материалы грантового проекта"
site_url: https://kraskimira89-spec.github.io/chebarkul/
repo_url: https://github.com/kraskimira89-spec/chebarkul
repo_name: kraskimira89-spec/chebarkul
edit_uri: edit/main/docs/
validation:
  links:
    unrecognized_links: ignore
theme:
  name: material
  language: ru
markdown_extensions:
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/grant-docs.css
nav:
  - Главная: README.md
  - Материалы гранта:
      - Обзор: grant/README.md
      - Договор (PDF): grant/dogovor.md
      - Техническое задание: grant/tz.md
      - Структура проекта: grant/struktura-proekta.md
  - Презентация:
      - Слайды: presentations/grant-presentation.md
      - Экспорт PDF/PPTX: presentations/README.md
